name: Label PR type

# Release notes sort PRs by their bug/feature/enhancement/documentation label.
# Issues get one from their template; this copies it onto the PR that fixes the
# issue. No model, no checkout: it reads the PR payload and the linked issues.

on:
  pull_request_target:
    # SECURITY: never check out or run PR-head code here.
    types: [opened, edited, reopened, ready_for_review]

concurrency:
  group: label-pr-type-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  issues: read
  pull-requests: write

jobs:
  label:
    if: ${{ !endsWith(github.event.pull_request.user.login, '[bot]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            // Most specific first: a fix for a bug is a fix even if the issue is also docs.
            const TYPES = ['bug', 'feature', 'enhancement', 'documentation'];
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const current = new Set(pr.labels.map((label) => label.name));
            if (TYPES.some((type) => current.has(type))) {
              console.log('PR already has a type label');
              return;
            }

            // Same auto-close references require-issue-link.yml accepts.
            const repoRef = `${owner}/${repo}`.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const pattern = new RegExp(
              '(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\\s*:?\\s*' +
                `(?:${repoRef}#|#|https?://github\\.com/${repoRef}/issues/)(\\d+)`,
              'gi',
            );
            const numbers = [...new Set([...(pr.body || '').matchAll(pattern)].map((m) => Number(m[1])))];

            const found = new Set();
            for (const number of numbers.slice(0, 5)) {
              try {
                const { data } = await github.rest.issues.get({ owner, repo, issue_number: number });
                if (data.pull_request) continue;
                for (const label of data.labels) found.add(typeof label === 'string' ? label : label.name);
              } catch (error) {
                console.log(`Could not read #${number}: ${error.message}`);
              }
            }
            let type = TYPES.find((name) => found.has(name));

            if (!type && numbers.length === 0) {
              // No linked issue: a docs-only change is still clearly documentation.
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner, repo, pull_number: pr.number, per_page: 100,
              });
              if (files.length > 0 && files.every((file) => file.filename.startsWith('docs/'))) {
                type = 'documentation';
              }
            }

            if (!type) {
              console.log(`No type label to copy (linked: ${numbers.join(', ') || 'none'})`);
              return;
            }
            await github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels: [type] });
            console.log(`Labeled #${pr.number} ${type}`);
