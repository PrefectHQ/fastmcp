name: Publish fastmcp-events to PyPI

on:
  workflow_run:
    workflows: ["Publish fastmcp-slim to PyPI"]
    types: [completed]

permissions:
  contents: read
  id-token: write

jobs:
  pypi-publish:
    name: Upload fastmcp-events to PyPI
    runs-on: ubuntu-latest
    environment: pypi-fanout
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'release'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      # Releases before the package split (including maintenance branches) have
      # no fastmcp_events directory. This workflow runs from the default branch
      # for every fastmcp-slim release, so detect the package rather than
      # assume it is there.
      - name: Check whether this ref builds fastmcp-events
        id: package_present
        run: |
          if [ -d fastmcp_events ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "This ref has no fastmcp_events package; nothing to publish."
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Build fastmcp-events
        if: steps.package_present.outputs.present == 'true'
        run: uv build --package fastmcp-events

      - name: Verify matching fastmcp-slim is published
        if: steps.package_present.outputs.present == 'true'
        run: |
          SLIM_VERSION=$(python - <<'PY'
          import email.parser
          import re
          import zipfile
          from pathlib import Path

          wheel = next(Path("dist").glob("fastmcp_events-*.whl"))
          metadata_name = next(
              name for name in zipfile.ZipFile(wheel).namelist()
              if name.endswith(".dist-info/METADATA")
          )
          metadata = email.parser.Parser().parsestr(
              zipfile.ZipFile(wheel).read(metadata_name).decode()
          )
          for value in metadata.get_all("Requires-Dist", []):
              requirement, _, marker = value.partition(";")
              if marker.strip():
                  continue
              match = re.fullmatch(
                  r"fastmcp-slim(?:\[[^\]]+\])?==([^;\s]+)",
                  requirement.strip(),
              )
              if match:
                  print(match.group(1))
                  break
          else:
              raise RuntimeError("Could not find the base fastmcp-slim dependency")
          PY
          )

          for attempt in {1..12}; do
            if python - "$SLIM_VERSION" <<'PY'
          import json
          import sys
          import urllib.request

          version = sys.argv[1]
          url = f"https://pypi.org/pypi/fastmcp-slim/{version}/json"
          with urllib.request.urlopen(url, timeout=30) as response:
              json.load(response)
          PY
            then
              exit 0
            fi

            echo "fastmcp-slim ${SLIM_VERSION} is not available on PyPI yet; retrying (${attempt}/12)."
            sleep 10
          done

          echo "fastmcp-slim ${SLIM_VERSION} is not available on PyPI; refusing to publish fastmcp-events." >&2
          exit 1

      - name: Publish fastmcp-events to PyPI
        if: steps.package_present.outputs.present == 'true'
        run: uv publish -v dist/fastmcp_events-*.tar.gz dist/fastmcp_events-*.whl
