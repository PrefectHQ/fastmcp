name: Maintenance status
description: Publishes automation health and contributor queue counts to the status branch
on:
  schedule:
    - cron: "0 13,21 * * *" # 1 PM and 9 PM UTC
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/maintenance-status.yml"
      - "scripts/maintenance_status.py"
      - "scripts/gate_digest.py"

permissions: {}

jobs:
  # Runs the repository's script with a read-only token, including on PRs.
  build:
    # Fork PRs can't read the Jev key.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0

      - name: Build status
        run: uv run scripts/maintenance_status.py "$RUNNER_TEMP/status" > /dev/null
        env:
          GH_TOKEN: ${{ github.token }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}

      - name: Show status
        run: cat "$RUNNER_TEMP/status/STATUS.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the snapshot
        uses: actions/upload-artifact@v7
        with:
          name: status
          path: ${{ runner.temp }}/status
          retention-days: 3

  # Holds the only write token, and runs no repository code: it copies the
  # built files onto the status branch as a new commit.
  publish:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: maintenance-status-publish
      cancel-in-progress: false
    steps:
      - name: Fetch the snapshot
        uses: actions/download-artifact@v8
        with:
          name: status
          path: snapshot

      - name: Commit to the status branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git init -q site
          cd site
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
          if git fetch -q --depth 1 origin status; then
            git checkout -q -b status FETCH_HEAD
          else
            git checkout -q --orphan status
          fi
          cp ../snapshot/status.json ../snapshot/STATUS.md ../snapshot/badge.json .
          git add status.json STATUS.md badge.json
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "status: $(jq -r .as_of status.json)"
          git push -q origin status
