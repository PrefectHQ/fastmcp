name: Garden

# Daily gardening report: smoke-tests what's on PyPI and what's on main, and
# summarizes what changed since the last release. See scripts/garden.py.
# Manual for now; a schedule comes after a few runs show the signal is useful.

env:
  PY_COLORS: 1

on:
  workflow_dispatch:

  pull_request:
    paths:
      - ".github/workflows/garden.yml"
      - "scripts/garden.py"
      - "scripts/garden_smoke.py"

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  garden:
    name: Garden report
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          # Tags and history back to the last stable release.
          fetch-depth: 0

      - name: Setup uv
        uses: ./.github/actions/setup-uv
        with:
          python-version: "3.12"

      - name: Build wheels from this checkout
        run: |
          for package in . fastmcp_slim fastmcp_tasks fastmcp_remote; do
            uv build --quiet --wheel --out-dir "$RUNNER_TEMP/wheels" "$package"
          done

      - name: Build report
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run scripts/garden.py "$RUNNER_TEMP/garden" --main-wheels "$RUNNER_TEMP/wheels"

      - name: Show report
        run: cat "$RUNNER_TEMP/garden/GARDEN.md" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: garden-report
          path: ${{ runner.temp }}/garden/
