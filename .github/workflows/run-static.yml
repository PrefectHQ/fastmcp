name: Run static analysis

env:
  PY_COLORS: 1

on:
  push:
    branches: ["main"]

  # run on all pull requests because these checks are required and will block merges otherwise
  pull_request:

  workflow_dispatch:

# Only newer revisions of the same PR supersede a run. Main and manual runs
# use unique groups so they always complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  static_analysis:
    timeout-minutes: 2
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check published skills match their sources
        run: diff -ru skills docs/.mintlify/skills

      - name: Setup uv
        uses: ./.github/actions/setup-uv
        with:
          resolution: locked

      - name: Setup gitleaks
        uses: ./.github/actions/setup-gitleaks

      - name: Test workflows
        run: node --test .github/scripts/test-*.mjs

      - name: Run prek
        uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
        env:
          SKIP: no-commit-to-branch
