name: Run static analysis

env:
  PY_COLORS: 1

on:
  push:
    branches: ["main"]
    paths:
      - "fastmcp_slim/**"
      - "fastmcp_remote/**"
      - "tests/**"
      - "examples/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/**"

  # Keep required checks present; skip expensive jobs for skills-only PRs.
  pull_request:

  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    uses: ./.github/workflows/skills-only.yml

  static_analysis:
    needs: changes
    if: always() && needs.changes.outputs.skills-only != 'true'
    timeout-minutes: 2
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup uv
        uses: ./.github/actions/setup-uv
        with:
          resolution: locked

      - name: Run prek
        uses: j178/prek-action@v3.0.0
        env:
          SKIP: no-commit-to-branch
