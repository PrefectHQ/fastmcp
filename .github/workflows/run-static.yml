name: Run static analysis

env:
  PY_COLORS: 1

on:
  push:
    branches: ["main"]
    paths:
      - "fastmcp_slim/**"
      - "fastmcp_remote/**"
      - "tests/**"
      - "examples/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/**"
      - ".github/scripts/test-issue-link.mjs"

  # run on all pull requests because these checks are required and will block merges otherwise
  pull_request:

  workflow_dispatch:

permissions:
  contents: read

jobs:
  static_analysis:
    timeout-minutes: 2
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup uv
        uses: ./.github/actions/setup-uv
        with:
          resolution: locked

      - name: Test issue-link workflow
        run: node --test .github/scripts/test-issue-link.mjs

      - name: Run prek
        uses: j178/prek-action@v3.0.0
        env:
          SKIP: no-commit-to-branch
