name: Marvin Issue Dedupe
# description: Automatically dedupe GitHub issues using Marvin
on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to process for duplicate detection"
        required: true
        type: string

jobs:
  marvin-dedupe-issues:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write

    # Pinned Claude Code; see the matching note in marvin-label-triage.yml.
    env:
      PINNED_CLAUDE_CODE_VERSION: "2.1.282"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Generate read-only Marvin App token
        id: marvin-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.MARVIN_APP_ID }}
          private-key: ${{ secrets.MARVIN_APP_PRIVATE_KEY }}
          # This token is the model's GH_TOKEN, so it only reads. Unscoped, it
          # would inherit the App installation's full set, including
          # contents: write and actions: write. The comment and label are
          # written after the model exits, with a separate token.
          permission-contents: read
          permission-issues: read

      - name: Set dedupe prompt
        id: dedupe-prompt
        run: |
          cat >> $GITHUB_OUTPUT << 'EOF'
          PROMPT<<PROMPT_END
          Find up to 3 likely duplicate issues for GitHub issue ${{ github.repository }}/issues/${{ github.event.issue.number || inputs.issue_number }}.

          # Core Principle
          Silence is better than noise. A false positive wastes a human's time and erodes trust in every future report. Most runs should end with no comment — that means the system is working.

          # Steps

          1. Check if the GitHub issue (a) is closed, (b) does not need to be deduped (eg. because it is broad product feedback without a specific solution, or positive feedback), or (c) already has a duplicates comment that you made earlier. If so, return an empty `duplicates` list.

          2. View the GitHub issue and produce a summary of the issue.

          3. Launch 3 parallel agents using the Task tool to search GitHub for duplicates, using diverse keywords and search approaches, using the summary from step 2.

          4. Filter aggressively for false positives. The bar for "duplicate" is high:

             A duplicate means the SAME bug or the SAME feature request. Apply this test to every candidate:
             - **Same fix test**: Could the candidate be closed by the exact same code change? If not, not a duplicate.
             - **Same symptom test**: Does the user experience the exact same broken behavior? "Both involve middleware" is not duplication. "Both get TypeError on line 42 of proxy.py when calling mount()" is duplication.
             - **Same request test** (for features): Are they asking for the same specific capability? "Both want better auth" is not duplication. "Both request OAuth PKCE flow for CLI login" is duplication.

             Candidates found by only one search agent deserve extra scrutiny — a single keyword match is often a false positive.

             When in doubt, do not flag. A missed duplicate is harmless; a false positive wastes the reporter's time.
             If there are no duplicates remaining, return an empty `duplicates` list.

          5. **Quality gate**: Before answering, re-read each candidate as a skeptical reviewer. For each one, ask: "Would a maintainer who knows this codebase agree this is a duplicate, or would they dismiss it?" If you'd need to hedge with "might" or "possibly," drop it.

          6. Return the numbers of the remaining duplicates, most likely first, in `duplicates`. You have no tool for commenting or labeling. A later workflow step posts the comment and applies the label.

          # Notes for your agents
          - Use `gh` to interact with GitHub, rather than web fetch
          - Do not use other tools beyond `gh` and Task (no MCP servers, file edit, etc.)
          - Never include this issue as a duplicate of itself
          - When searching, read the FULL body of candidate issues — titles alone are not enough to judge duplication
          PROMPT_END
          EOF

      - name: Clean up stale Claude locks
        run: rm -rf ~/.claude/.locks ~/.local/state/claude/locks || true

      - name: Install pinned Claude Code
        id: pin-claude
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s -- "$PINNED_CLAUDE_CODE_VERSION"
          echo "path=$HOME/.local/bin/claude" >> "$GITHUB_OUTPUT"
          "$HOME/.local/bin/claude" --version

      - name: Run Marvin dedupe command
        id: marvin
        uses: anthropics/claude-code-action@v1
        with:
          path_to_claude_code_executable: ${{ steps.pin-claude.outputs.path }}
          github_token: ${{ steps.marvin-token.outputs.token }}
          bot_name: "Marvin Context Protocol"
          prompt: ${{ steps.dedupe-prompt.outputs.PROMPT }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY_FOR_CI }}
          allowed_non_write_users: "*"
          # No `Bash(gh api:*)`: it reaches every endpoint the token can. Dedupe
          # searches and reads with the three verbs below, then returns issue
          # numbers through --json-schema. It has no tool that writes.
          claude_args: |
            --allowedTools "Bash(gh issue view:*)","Bash(gh search:*)","Bash(gh issue list:*)",Task
            --json-schema '{"type":"object","properties":{"duplicates":{"type":"array","items":{"type":"integer"},"maxItems":3}},"required":["duplicates"],"additionalProperties":false}'
          settings: |
            {
              "model": "claude-sonnet-5",
              "env": {
                "GH_TOKEN": "${{ steps.marvin-token.outputs.token }}"
              }
            }

      - name: Generate Marvin App token for writing
        id: marvin-write-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.MARVIN_APP_ID }}
          private-key: ${{ secrets.MARVIN_APP_PRIVATE_KEY }}
          permission-issues: write

      # The comment and label always go to this issue, and the comment always
      # has this format. The model only chooses which issue numbers appear.
      - name: Post duplicate comment and label
        env:
          GH_TOKEN: ${{ steps.marvin-write-token.outputs.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number || inputs.issue_number }}
          RESULT: ${{ steps.marvin.outputs.structured_output }}
        run: |
          if [[ ! "$ISSUE" =~ ^[0-9]+$ ]]; then
            echo "::error::Issue number must be numeric, got: $ISSUE"
            exit 1
          fi
          if [[ -z "$RESULT" ]]; then
            echo "Marvin returned no structured output; nothing to post."
            exit 0
          fi

          # Keep positive integers other than this issue, in the model's
          # order, without repeats, and at most 3.
          numbers=$(jq -r --argjson self "$ISSUE" '
            [(.duplicates // [])[]
              | select(type == "number" and . == floor and . > 0 and . != $self)]
            | reduce .[] as $n ([]; if any(.[]; . == $n) then . else . + [$n] end)
            | .[:3][]
          ' <<<"$RESULT")
          if [[ -z "$numbers" ]]; then
            echo "No duplicates to report."
            exit 0
          fi

          state=$(gh api "repos/$REPO/issues/$ISSUE" --jq .state)
          if [[ "$state" != "open" ]]; then
            echo "Issue #$ISSUE is $state; not commenting."
            exit 0
          fi
          bot_comments=$(gh api --paginate "repos/$REPO/issues/$ISSUE/comments" \
            --jq '.[] | select(.user.type == "Bot") | .body')
          if grep -qi "possible duplicate issue" <<<"$bot_comments"; then
            echo "Issue #$ISSUE already has a duplicate comment; not commenting again."
            exit 0
          fi

          # Pull requests and numbers that do not exist are dropped. Titles
          # come from the API, with @-mentions broken so they notify no one.
          lines=()
          while read -r n; do
            title=$(gh api "repos/$REPO/issues/$n" \
              --jq 'select(has("pull_request") | not) | .title | gsub("@"; "@​")') || continue
            if [[ -n "$title" ]]; then
              lines+=("$(( ${#lines[@]} + 1 )). #$n: $title")
            fi
          done <<<"$numbers"

          count=${#lines[@]}
          if [[ "$count" -eq 0 ]]; then
            echo "None of the returned numbers is an issue in $REPO; not commenting."
            exit 0
          fi
          noun="issues"
          if [[ "$count" -eq 1 ]]; then
            noun="issue"
          fi

          body="$RUNNER_TEMP/dedupe-comment.md"
          {
            echo "Found $count possible duplicate $noun:"
            echo
            printf '%s\n' "${lines[@]}"
            echo
            echo "This issue will be automatically closed as a duplicate in 3 days."
            echo
            echo "- If your issue is a duplicate, please close it and 👍 the existing issue instead"
            echo "- To prevent auto-closure, add a comment or 👎 this comment"
          } > "$body"
          gh issue comment "$ISSUE" -R "$REPO" --body-file "$body"
          gh issue edit "$ISSUE" -R "$REPO" --add-label "potential-duplicate"
          echo "Posted $count possible duplicate(s) and added potential-duplicate to #$ISSUE"
