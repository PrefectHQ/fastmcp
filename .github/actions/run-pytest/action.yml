name: "Run Pytest"
description: "Run pytest with appropriate flags for the test type and platform"

inputs:
  test-type:
    description: "Type of tests to run: unit, integration, client_process, or conformance"
    required: false
    default: "unit"

runs:
  using: "composite"
  steps:
    - name: Install Redis for credential rotation integration tests
      if: inputs.test-type == 'integration' && runner.os == 'Linux'
      shell: bash
      run: |
        if ! command -v redis-server >/dev/null; then
          sudo apt-get update
          sudo apt-get install -y redis-server
        fi

    - name: Run pytest
      shell: bash
      env:
        TEST_TYPE: ${{ inputs.test-type }}
      run: |
        if [ "$TEST_TYPE" == "integration" ]; then
          MARKER="integration"
          TIMEOUT="30"
          MAX_PROCS="2"
          EXTRA_FLAGS=""
        elif [ "$TEST_TYPE" == "client_process" ]; then
          MARKER="client_process or subprocess_heavy"
          TIMEOUT="5"
          MAX_PROCS="0"
          EXTRA_FLAGS="-x"
        elif [ "$TEST_TYPE" == "conformance" ]; then
          MARKER="conformance"
          TIMEOUT="120"
          MAX_PROCS="0"
          EXTRA_FLAGS="-x"
        else
          MARKER="not integration and not client_process and not subprocess_heavy and not conformance"
          TIMEOUT="5"
          MAX_PROCS="4"
          EXTRA_FLAGS=""
        fi

        # Windows previously ran serially: parallel workers crashed intermittently
        # when many tests spawned stdio subprocesses (#2715, reverted in #2726).
        # Most of those tests now run in-memory, but tests that spawn a fresh
        # interpreter importing all of FastMCP still crash xdist workers on the
        # 2-core Windows runners. They carry the subprocess_heavy marker and run
        # in the serial client_process step instead.
        PARALLEL_FLAGS=""
        if [ "$MAX_PROCS" != "0" ]; then
          PARALLEL_FLAGS="--numprocesses auto --maxprocesses $MAX_PROCS --dist worksteal"
        fi

        # pytest-timeout has no signal-based method on Windows, so it falls back
        # to the thread method, which dumps stacks and os._exit()s the process.
        # On a stalled runner (a 5s mkdir, a slow cold PowerShell) that kills
        # the pytest process or xdist worker and blames whatever test happened
        # to be running, so every Windows flake looked like a different test.
        # Windows runs without per-test hard kills: Linux still enforces the
        # timeouts (and catches real hangs), faulthandler dumps stacks for a
        # slow Windows test without killing it, and the job's timeout-minutes
        # is the backstop for a genuine Windows-only hang.
        TIMEOUT_FLAGS="--timeout=$TIMEOUT"
        if [ "$RUNNER_OS" == "Windows" ]; then
          TIMEOUT_FLAGS="-p no:timeout -o faulthandler_timeout=60"
        fi

        uv run --no-sync pytest \
          --inline-snapshot=disable \
          $TIMEOUT_FLAGS \
          --durations=50 \
          -m "$MARKER" \
          $PARALLEL_FLAGS \
          $EXTRA_FLAGS \
          tests
