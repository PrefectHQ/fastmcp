name: "Setup UV Environment"
description: "Install uv and dependencies (requires checkout first)"

inputs:
  python-version:
    description: "Python version to use"
    required: false
    default: "3.10"
  resolution:
    description: "Dependency resolution: locked, upgrade, or lowest-direct"
    required: false
    default: "locked"

runs:
  using: "composite"
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"
        python-version: ${{ inputs.python-version }}

    - name: Install dependencies
      shell: bash
      env:
        RESOLUTION: ${{ inputs.resolution }}
      run: |
        if [ "$RESOLUTION" == "locked" ]; then
          uv sync --locked
        elif [ "$RESOLUTION" == "upgrade" ]; then
          uv sync --upgrade
        else
          uv sync --resolution "$RESOLUTION"
        fi
