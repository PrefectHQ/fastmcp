name: "Setup gitleaks"
description: "Install the gitleaks binary onto PATH for the gitleaks prek hook"

inputs:
  version:
    description: "gitleaks release version (without leading v)"
    required: false
    default: "8.30.1"

runs:
  using: "composite"
  steps:
    - name: Install gitleaks
      shell: bash
      env:
        GITLEAKS_VERSION: ${{ inputs.version }}
      run: |
        curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
          | tar -xz -C /usr/local/bin gitleaks
        gitleaks version
