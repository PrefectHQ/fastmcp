name: fastmcp-agentic-maintenance
build: []
push: []
pull:
  - prefect.deployments.steps.git_clone:
      id: source
      repository: https://github.com/PrefectHQ/fastmcp.git
      commit_sha: "{{ $FASTMCP_AGENTIC_REF }}"
  - prefect.deployments.steps.set_working_directory:
      directory: "{{ source.directory }}/.github/agentic"
deployments:
  - name: cloud-triage-verify
    version: "{{ $FASTMCP_AGENTIC_REF }}"
    entrypoint: flows/agentic_triage_nodes.py:triage_verify
    schedules: []
    concurrency_limit: 3
    parameters: {}
    work_pool:
      name: managed
      job_variables:
        image: prefecthq/prefect:3-python3.12
        pip_packages:
          - prefect==3.8.2
          - fastapi==0.141.1
        compute_profile: medium
        timeout: 7200
  - name: cloud-triage-finalize
    version: "{{ $FASTMCP_AGENTIC_REF }}"
    entrypoint: flows/agentic_triage_nodes.py:triage_finalize
    schedules: []
    concurrency_limit: 3
    parameters: {}
    work_pool:
      name: managed
      job_variables:
        image: prefecthq/prefect:3-python3.12
        pip_packages:
          - prefect==3.8.2
          - fastapi==0.141.1
        compute_profile: small
        timeout: 600
  - name: cloud-triage-intake
    version: "{{ $FASTMCP_AGENTIC_REF }}"
    entrypoint: flows/agentic_triage.py:triage_intake
    schedules: []
    concurrency_limit: 8
    parameters: {}
    work_pool:
      name: managed
      job_variables:
        image: prefecthq/prefect:3-python3.12
        pip_packages:
          - prefect==3.8.2
          - fastapi==0.141.1
          - PyJWT[crypto]==2.15.1
        compute_profile: medium
        timeout: 7800
  - name: cloud-contribution-verification
    version: "{{ $FASTMCP_AGENTIC_REF }}"
    entrypoint: flows/agentic_pr_verification.py:verify_contribution
    schedules: []
    concurrency_limit: 3
    parameters: {}
    work_pool:
      name: managed
      job_variables:
        image: prefecthq/prefect:3-python3.12
        pip_packages:
          - prefect==3.8.2
          - fastapi==0.141.1
        compute_profile: medium
        timeout: 3300
  - name: cloud-stack-batch
    version: "{{ $FASTMCP_AGENTIC_REF }}"
    entrypoint: flows/agentic_stack_controller.py:stack_batch
    schedules: []
    concurrency_limit: 8
    parameters: {}
    work_pool:
      name: managed
      job_variables:
        image: prefecthq/prefect:3-python3.12
        pip_packages:
          - prefect==3.8.2
          - fastapi==0.141.1
          - PyJWT[crypto]==2.15.1
          - turbopuffer==3.1.0
          - fastmcp==4.2.4
        compute_profile: medium
        timeout: 7500
  - name: cloud-triage-sweep
    version: "{{ $FASTMCP_AGENTIC_REF }}"
    entrypoint: flows/agentic_sweep.py:sweep
    concurrency_limit: 1
    parameters:
      reviewer_app:
        app_id: 5514681
        slug: fastmcp-triage-reviewer
        private_key_block: fastmcp-triage-reviewer-private-key
    schedules:
      # Monday 8am Chicago: label inactive items and list them in Slack.
      - cron: "0 14 * * 1"
        timezone: UTC
        parameters:
          phase: propose
      # Daily: close items whose veto window has passed.
      - cron: "0 15 * * *"
        timezone: UTC
        parameters:
          phase: close
    work_pool:
      name: managed
      job_variables:
        image: prefecthq/prefect:3-python3.12
        pip_packages:
          - prefect==3.8.2
          - fastapi==0.141.1
          - PyJWT[crypto]==2.15.1
        compute_profile: small
        timeout: 1200
  - name: cloud-triage-digest
    version: "{{ $FASTMCP_AGENTIC_REF }}"
    entrypoint: flows/agentic_digest.py:digest
    concurrency_limit: 1
    schedules:
      # 8am Chicago: the agent writes the day's digest.
      - cron: "0 8 * * *"
        timezone: America/Chicago
        parameters:
          mode: morning
      # Every three hours: the agent posts only what shouldn't wait for morning.
      - cron: "30 */3 * * *"
        timezone: UTC
        parameters:
          mode: check
    work_pool:
      name: managed
      job_variables:
        image: prefecthq/prefect:3-python3.12
        pip_packages:
          - prefect==3.8.2
          - fastapi==0.141.1
          - PyJWT[crypto]==2.15.1
        compute_profile: small
        timeout: 1200
  - name: cloud-triage-audit
    version: "{{ $FASTMCP_AGENTIC_REF }}"
    entrypoint: flows/agentic_audit.py:audit
    concurrency_limit: 1
    schedules:
      # 7am Chicago, before the digest: look for yesterday's wrong writes. Reports only.
      - cron: "0 7 * * *"
        timezone: America/Chicago
    work_pool:
      name: managed
      job_variables:
        image: prefecthq/prefect:3-python3.12
        pip_packages:
          - prefect==3.8.2
          - fastapi==0.141.1
          - PyJWT[crypto]==2.15.1
        compute_profile: small
        timeout: 1200
  - name: cloud-triage-memory-sync
    version: "{{ $FASTMCP_AGENTIC_REF }}"
    entrypoint: flows/agentic_memory_sync.py:triage_memory_sync
    concurrency_limit: 1
    parameters: {}
    schedules:
      # Re-index what changed in the last two hours; overlapping windows make a
      # missed run harmless. Does nothing while memory is off in the config.
      - cron: "*/30 * * * *"
        timezone: UTC
    work_pool:
      name: managed
      job_variables:
        image: prefecthq/prefect:3-python3.12
        pip_packages:
          - prefect==3.8.2
          - fastapi==0.141.1
          - turbopuffer==3.1.0
        compute_profile: small
        timeout: 1800
